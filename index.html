<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Content-Security-Policy: only this site's own scripts run, and the page may only open a connection to the relay
         server (VITE_WS_URL, filled in by Vite). Styles allow 'unsafe-inline' only because Vite's dev server injects CSS as
         <style> tags; the production build uses a normal stylesheet file. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' %VITE_WS_URL%; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <link rel="icon" type="image/jpeg" href="/favicon.jpg" />
    <!-- iOS ignores rel="icon" for "Add to Home Screen"; it needs a 180x180 opaque PNG apple-touch-icon. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="LocalChess" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LocalChess</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
